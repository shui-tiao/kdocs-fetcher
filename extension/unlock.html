<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>解锁 - 金山文档拉取器</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 32px 16px; min-width: 300px; background: #fff; color: #333; font-family: "Microsoft YaHei", sans-serif; }
    .box { width: 320px; max-width: 100%; margin: 0 auto; text-align: center; }
    .icon-wrap { width: 52px; height: 52px; margin: 0 auto 14px; border-radius: 50%; background: #fce8e6; display: flex; align-items: center; justify-content: center; }
    .icon-wrap svg { width: 26px; height: 26px; stroke: #d93025; fill: none; stroke-width: 2; }
    h1 { font-size: 16px; margin: 0 0 8px; }
    .desc { font-size: 12px; color: #666; line-height: 1.8; margin: 0 0 18px; }
    #pin { width: 190px; padding: 10px 12px; font-size: 20px; text-align: center; letter-spacing: 6px; font-family: inherit; border: 1px solid #dadce0; border-radius: 6px; }
    #pin:focus { outline: none; border-color: #1a73e8; box-shadow: 0 0 0 2px rgba(26, 115, 232, .15); }
    #pin:disabled { background: #f6f8fa; color: #999; }
    .error { min-height: 18px; margin-top: 10px; font-size: 12px; color: #d93025; }
    .hint { margin-top: 10px; padding: 10px 12px; font-size: 12px; line-height: 1.7; color: #b3261e; background: #fce8e6; border-radius: 6px; text-align: left; }
    .hint[hidden] { display: none; }
  </style>
</head>
<body>
  <div class="box">
    <div class="icon-wrap">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    </div>
    <h1>扩展已锁定</h1>
    <p class="desc">扩展当前所有功能不可用<br>请输入 6 位数字 PIN 解锁</p>
    <input id="pin" type="password" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="••••••" aria-label="6 位数字 PIN">
    <div id="error" class="error"></div>
    <div id="hint" class="hint" hidden></div>
  </div>
  <script src="lock.js"></script>
  <script src="unlock.js"></script>
</body>
</html>
