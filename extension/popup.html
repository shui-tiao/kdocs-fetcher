<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <style>
    body { font-family: "Microsoft YaHei", sans-serif; width: 340px; margin: 0; padding: 16px; color: #333; }
    h1 { font-size: 14px; margin: 0 0 12px; }
    #content { font-size: 13px; line-height: 1.7; word-break: break-all; white-space: pre-wrap; background: #f6f8fa; border-radius: 6px; padding: 12px; min-height: 40px; }
    #content.loading { color: #888; }
    #content.error { color: #d93025; background: #fce8e6; }
    #meta { font-size: 12px; color: #999; margin-top: 6px; }
    #actions { margin-top: 12px; display: flex; gap: 8px; }
    button { flex: 1; padding: 7px 0; font-size: 13px; border: none; border-radius: 4px; cursor: pointer; }
    #copy { background: #1a73e8; color: #fff; }
    #copy:hover { background: #1557b0; }
    #copy:disabled { background: #b3d7ff; cursor: default; }
    #refresh { background: #f1f3f4; color: #333; }
    #refresh:hover { background: #e2e5e7; }
    #openOptions { background: #1a73e8; color: #fff; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <h1>最新一条【内容】</h1>
  <div id="content" class="loading">加载中…</div>
  <div id="meta"></div>
  <div id="actions">
    <button id="copy" disabled>复制</button>
    <button id="refresh">重新获取</button>
  </div>
  <button id="openOptions" class="hidden">前往配置</button>
  <script src="popup.js"></script>
</body>
</html>
